<!-- REQ-012: Current Intensity Badge -->
<p-card styleClass="intensity-card">
  <ng-template #header>
    <div class="card-header">
      <i class="pi pi-gauge"></i>
      <span>Current Intensity</span>
    </div>
  </ng-template>

  @if (latestRecord(); as record) {
    <div class="intensity-value" data-testid="intensity-value">
      <span class="value">{{ record.globalIntensity | number:'1.1-1' }}</span>
      <span class="unit">A</span>
    </div>
    <div class="intensity-meta" data-testid="intensity-meta">
      {{ record.date }} at {{ record.time }}
    </div>
  } @else {
    <div class="no-data">No data</div>
  }
</p-card>
