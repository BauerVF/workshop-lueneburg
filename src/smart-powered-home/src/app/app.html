<header class="dashboard__header">
  <h1>Smart Powered Home</h1>
</header>

@if (loading()) {
  <div class="dashboard__content">
    <div class="dashboard__skeleton-widgets">
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
    </div>
    <div class="skeleton skeleton-chart"></div>
    <div class="skeleton skeleton-table"></div>
  </div>
} @else if (error()) {
  <div class="dashboard__content">
    <p class="dashboard__error">Error: {{ error() }}</p>
  </div>
} @else {
  <app-info-bar />

  <div class="dashboard__content">
    <section class="dashboard__widgets">
      <app-power-overview-widget />
      <app-daily-total-badge />
      <app-current-intensity-badge />
      <app-standby-load-indicator />
      <div class="dashboard__widgets-last-row">
        <app-top-consumption-hours />
        <div class="dashboard__hero-wrapper">
          <img class="dashboard__hero-image" src="/hero-bg.png" alt="Smart home in the evening" />
        </div>
      </div>
    </section>

    <section class="dashboard__charts">
      <app-consumption-timeline-chart />
      <app-submetering-breakdown-chart />
    </section>

    <section class="dashboard__table">
      <app-consumption-data-table />
    </section>
  </div>
}
