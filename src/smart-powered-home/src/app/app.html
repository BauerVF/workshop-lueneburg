<!-- Smart Powered Home Dashboard -->
@if (powerService.loading()) {
  <app-loading-skeleton />
} @else if (powerService.error()) {
  <div class="error-banner">
    <i class="pi pi-exclamation-circle"></i>
    <span>Error: {{ powerService.error() }}</span>
  </div>
} @else {
  <div class="dashboard">
    <!-- Row 1: Overview cards -->
    <div class="dashboard-row dashboard-row--cards">
      <app-power-overview [records]="filteredRecords()" />
      <app-daily-total-badge [records]="filteredRecords()" />
      <app-top3-hours [records]="filteredRecords()" />
    </div>

    <!-- Row 2: Timeline chart (full width) -->
    <app-consumption-timeline
      (dateChanged)="onTimelineDateChanged($event)"
      (dateRangeChanged)="onTimelineDateRangeChanged($event)"
      (rangeModeChanged)="onTimelineRangeModeChanged($event)"
    />

    <!-- Row 3: Breakdown chart + Peak alerts -->
    <div class="dashboard-row dashboard-row--half">
      <app-submetering-breakdown [records]="filteredRecords()" />
      <app-peak-shaving [records]="filteredRecords()" />
    </div>
  </div>
}
