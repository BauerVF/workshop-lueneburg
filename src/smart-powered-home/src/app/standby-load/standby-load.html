<!-- REQ-016: Midnight Standby Load Indicator -->
<p-card styleClass="standby-card">
  <ng-template #header>
    <div class="card-header">
      <i class="pi pi-moon"></i>
      <span>Avg. Standby Load</span>
    </div>
  </ng-template>

  @if (standbyInfo(); as info) {
    <div class="standby-display" data-testid="standby-load">
      <div class="standby-value">
        <span class="value">{{ info.avgKw | number:'1.2-2' }}</span>
        <span class="unit">kW</span>
      </div>
      <div class="standby-meta">
        ~{{ info.wastedKwh | number:'1.2-2' }} kWh wasted per night
      </div>
      <div class="standby-sample">
        Based on {{ info.sampleCount | number }} readings (00:00–05:00)
      </div>
    </div>
  } @else {
    <div class="no-data">No nighttime data available</div>
  }
</p-card>
