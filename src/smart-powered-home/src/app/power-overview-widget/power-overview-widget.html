@if (lastRecord(); as record) {
  <div class="card">
    <div class="card__title">Current Power</div>
    <div class="card__value">{{ record.globalActivePower.toFixed(2) }} <span class="card__unit">kW</span></div>
    <div class="card__subtitle">{{ record.date }} at {{ record.time }}</div>
  </div>
}
