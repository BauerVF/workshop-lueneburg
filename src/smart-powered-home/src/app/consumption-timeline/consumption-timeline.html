<!-- REQ-003: Consumption Timeline Chart -->
<p-card styleClass="timeline-card">
  <ng-template #header>
    <div class="card-header">
      <div class="card-title">
        <i class="pi pi-chart-line"></i>
        <span>Power Consumption Over Time</span>
      </div>
      <div class="card-controls">
        @if (rangeMode() === 'day') {
          <div class="date-nav-group">
            <p-datepicker
              [ngModel]="calendarDate()"
              (ngModelChange)="onDateChange($event)"
              dateFormat="m/d/y"
              [showIcon]="true"
              [iconDisplay]="'input'"
              placeholder="Select date"
              data-testid="timeline-date-picker"
            >
              <ng-template #inputicon let-clickCallBack="clickCallBack">
                <img
                  src="icons/Calendar.png"
                  alt="Open calendar"
                  class="date-icon calendar-icon"
                  (click)="clickCallBack($event)"
                />
              </ng-template>
            </p-datepicker>
            <div class="day-arrows">
              <button
                class="day-arrow-btn"
                title="Next day"
                (click)="shiftDay(1)"
                data-testid="day-up"
              >
                <img src="icons/Up.png" alt="Next day" class="date-icon arrow-icon" />
              </button>
              <button
                class="day-arrow-btn"
                title="Previous day"
                (click)="shiftDay(-1)"
                data-testid="day-down"
              >
                <img src="icons/Down.png" alt="Previous day" class="date-icon arrow-icon" />
              </button>
            </div>
          </div>
        } @else {
          <p-datepicker
            [ngModel]="calendarDateRange()"
            (ngModelChange)="onDateRangeChange($event)"
            selectionMode="range"
            dateFormat="m/d/y"
            [showIcon]="true"
            [iconDisplay]="'input'"
            placeholder="Select date range"
            data-testid="timeline-date-range-picker"
          >
            <ng-template #inputicon let-clickCallBack="clickCallBack">
              <img
                src="icons/Calendar.png"
                alt="Open calendar"
                class="date-icon calendar-icon"
                (click)="clickCallBack($event)"
              />
            </ng-template>
          </p-datepicker>
        }
        <p-select
          [options]="rangeOptions"
          [ngModel]="rangeMode()"
          (ngModelChange)="onRangeModeChange($event)"
          optionLabel="label"
          optionValue="value"
          data-testid="timeline-range-select"
        />
      </div>
    </div>
  </ng-template>

  <div class="chart-container" data-testid="timeline-chart">
    @if (filteredRecords().length > 0) {
      <canvas
        baseChart
        type="line"
        [datasets]="chartDatasets()"
        [labels]="chartLabels()"
        [options]="chartOptions()"
      ></canvas>
    } @else {
      <div class="no-data">
        <i class="pi pi-info-circle"></i>
        <span>Select a date to view the consumption timeline.</span>
      </div>
    }
  </div>
</p-card>
